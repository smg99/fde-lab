version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fde
      POSTGRES_PASSWORD: fde
      POSTGRES_DB: fde_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde -d fde_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Future: ollama, grafana, prometheus, etc.

volumes:
  pgdata:
